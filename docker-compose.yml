# ==============================
# bhasha — Development Docker Compose
# ==============================
# Usage: docker compose up -d --build
# ==============================

services:
  # Java Spring Boot backend
  java-backend:
    build:
      context: ./server-java
      dockerfile: Dockerfile
    container_name: bhasha-java-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./server-java/.env
    networks:
      - bhasha-network

  # React/Vite frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: bhasha-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://java-backend:8085
      - VITE_JAVA_API_URL=http://localhost:8085
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - java-backend
    networks:
      - bhasha-network

networks:
  bhasha-network:
    driver: bridge
    name: bhasha-network
