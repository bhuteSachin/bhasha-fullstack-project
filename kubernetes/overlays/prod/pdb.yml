apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bhasha-server-pdb
  namespace: bhasha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bhasha
      component: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bhasha-client-pdb
  namespace: bhasha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bhasha
      component: client
